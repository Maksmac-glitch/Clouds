# Хороший CI/CD-файл: исправленная версия bad-ci.yml.
name: Good CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: good-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/clouds-app

jobs:
  test:
    name: Lint and test application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository safely
        uses: actions/checkout@v4

      - name: Setup pinned Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests without ignoring failures
        run: |
          python -m pytest -q

  build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository safely
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry only on push
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with commit tag
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Push image only from main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy:
    name: Deploy only after successful build
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deployment placeholder
        run: |
          echo "Deploy image $IMAGE_NAME:${{ github.sha }} to production after manual environment approval"
